[project]
name = "genesis"
version = "0.1.0"
description = "Bootstrapper for autonomous agentic AI dev systems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jinja2>=3.1.6",
]

[project.scripts]
genesis = "genesis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "playwright>=1.62.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pin the default index to PyPI so resolution is reproducible regardless of a
# contributor's machine-level uv config. Without this, a corporate proxy set as
# the default index in ~/.config/uv/uv.toml silently rewrites every source URL
# in uv.lock on re-resolve — same packages, same versions, same hashes, but
# pointing at a host nobody else can reach. That landed in a commit here once
# and had to be reverted. Project config wins over user config, so this holds.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
