name: Genesis Orchestrator (Events)

on:
  # No `labeled`, and its absence is load-bearing. The bot labels constantly —
  # `issues.sh claim` writes `in-progress`, `next` claims in the same call, the
  # escalation net applies two labels to the issue it files — and
  # `gh issue create --label` fires `opened` AND `labeled` for one issue, which
  # is what raced two 40-turn agents on genesis issue #37. The bot-actor guard
  # below catches each of those runs, but only after GitHub has queued it into
  # the shared concurrency group, where a single pending slot means a no-op run
  # can evict one that has real work (the shape measured in
  # genesis-ci-failure.yml, where it cost 157 runs' worth of triage). A human's
  # meaningful actions all arrive through the types that remain.
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

# One group shared by the scheduled and the event-driven orchestrator, because
# the collisions that hurt are between them, not within either. Measured twice:
# two `workflow_dispatch` runs 4 seconds apart each filed a "Milestone 1 plan"
# issue (genesis issue #22), and a human closing a milestone issue fired
# `issues:closed` and `issue_comment:created` together, so two runs both passed
# their duplicate check before either had created anything and filed 10 task
# issues for 5 tasks (genesis issue #11). An in-prompt "no duplicate issues" rule
# cannot win that race - the second run checks before the first has written.
#
# `cancel-in-progress: false` on purpose. Each event may carry state that only
# exists in that event - an issue-closed approval signal, a human's comment - and
# dropping the queued run drops the signal. Queue, don't cancel.
concurrency:
  group: genesis-orchestrator-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # Skip events from bots to prevent loops. A suffix test rather than a list
    # of names: the list shipped with three entries and the loop that burned
    # 30+ concurrent runs in `ronny-learns-ai` was started by a bot identity
    # nobody had thought to add (genesis issue #4). Every GitHub App actor ends
    # in `[bot]` and no human login can, so the suffix is the invariant and the
    # names were a guess at it.
    #
    # This is the same rule `is_bot_actor` applies in src/genesis/server.py. Two
    # execution modes disagreeing about what a bot is would mean a project's
    # loop-breaking depends on how it happens to be driven.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # `client-id`, not the deprecated `app-id`. The secret still holds the
          # numeric App ID and needs no adopter action - see the note in genesis's
          # own CLAUDE.md for why the rename is safe on already-scaffolded repos.
          client-id: ${{ secrets.GENESIS_APP_ID }}
          private-key: ${{ secrets.GENESIS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          # Without this every `gh run list` from inside the agent returns
          # 403 Resource not accessible by integration, which silently removes
          # failed workflow runs from the evolver's signal set - one of its
          # primary inputs - and leaves it reviewing a system it cannot see
          # failing (genesis issue #14, hit on the-gigi/butterfly). Read-only.
          permission-actions: read

      # Same backstop as genesis-orchestrator.yml, and needed here more, not
      # less. This is the workflow that fires on ordinary repo activity, so it
      # runs far more often than the six-hourly cron and strands claims at the
      # same rate - and in Actions there is no continuation ladder to notice a
      # run that died, so a cancelled or timed-out run releases nothing. With the
      # sweep only on the schedule, a claim stranded here waited up to six hours
      # for a cron tick to take it back, and `issues.sh next` skipped the issue
      # the whole time.
      #
      # Safe to run on every event because both orchestrator workflows share one
      # concurrency group: a sweep here cannot overlap a live orchestrator run,
      # and the window it enforces (DEFAULT_CLAIM_STALE_HOURS) clears a session's
      # own life anyway. Deterministic, so it runs before Claude and cannot be
      # skipped by a session that ran out of turns; non-fatal, because the safety
      # net must never stop the work it is protecting.
      - name: Release claims nobody is working
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .genesis/scripts/issues.sh sweep-claims

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "genesis-dev-bot[bot]"
          # Reaches the activity-logging hooks in .claude/settings.json. The
          # `settings` input MERGES with the repo's settings, so the hooks survive.
          # Unset secrets render as empty strings and log.sh skips the push. There is
          # no stderr consolation prize: Claude Code captures hook stderr into its
          # own transcript, so unconfigured Loki means no activity trail at all.
          settings: |
            {
              "env": {
                "GENESIS_LOKI_URL": "${{ secrets.GENESIS_LOKI_URL }}",
                "GENESIS_LOKI_USER": "${{ secrets.GENESIS_LOKI_USER }}",
                "GENESIS_LOKI_TOKEN": "${{ secrets.GENESIS_LOKI_TOKEN }}"
              }
            }
          prompt: |
            Run the orchestrator agent defined in .claude/agents/orchestrator.md.

            An event triggered this run:
            - Event: ${{ github.event_name }} / ${{ github.event.action }}

            Assess this event in context of the project state and take appropriate action.
          # Orchestrator class — see the turn-budget floor in CLAUDE.md. An event
          # often arrives carrying more work than a cron tick (assess, read a PR,
          # review the diff, merge, close), and subagents spend from this same
          # budget. Enforced at >= 30 by tests/e2e/test_workflows.py.
          claude_args: "--max-turns 40 --allowedTools Read,Write,Edit,Bash,Glob,Grep,Agent"

      # Reasoning in escalate.sh. What's specific to this workflow is that the
      # trigger is unrepeatable: a scheduled run that dies can be re-derived from
      # repository state six hours later, but the event that woke this one — a
      # person's comment, an approval close — exists only in the run that
      # received it. A failure here loses the signal, not just the turn.
      - name: Escalate to a human if this run failed
        if: failure()
        run: bash .genesis/scripts/escalate.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
